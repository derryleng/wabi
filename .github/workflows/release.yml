name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild \
            -scheme Wabi \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip app
        run: |
          APP_PATH="DerivedData/Build/Products/Release/Wabi.app"
          ditto -c -k --keepParent "$APP_PATH" Wabi.zip

      - name: Compute SHA256
        id: sha
        run: echo "sha256=$(shasum -a 256 Wabi.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and upload zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" Wabi.zip \
            --title "Wabi $GITHUB_REF_NAME" \
            --generate-notes

      - name: Update homebrew-tap cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WABI_VERSION: ${{ steps.version.outputs.version }}
          WABI_SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/derryleng/homebrew-tap.git tap
          sed -i '' \
            "s|version \".*\"|version \"${WABI_VERSION}\"|" \
            tap/Casks/wabi.rb
          sed -i '' \
            "s|sha256 \".*\"|sha256 \"${WABI_SHA256}\"|" \
            tap/Casks/wabi.rb
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/wabi.rb
          git commit -m "chore: update wabi to ${WABI_VERSION}"
          git push
